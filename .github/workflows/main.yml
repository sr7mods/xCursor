name: Compile Raw XML to Binary AXML

on:
  workflow_dispatch:
    inputs:
      xml_code:
        description: 'Raw XML Code (e.g., vector drawable)'
        required: true
        type: string
      file_name:
        description: 'File Name without extension (e.g., minecraft_normal)'
        required: true
        type: string

jobs:
      
  compile-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Store Branch
        uses: actions/checkout@v4
        with:
          ref: 'store'

      - name: Install aapt2 and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt2 wget

      - name: Download Android Stub Jar
        run: |
          # Download lightweight android.jar required for aapt2 attribute linking
          wget -q https://github.com/simpligility/android-maven-plugin/raw/master/src/test/resources/projects/base/libs/android.jar -O android.jar

      - name: Compile and Link XML to Binary AXML
        env:
          XML_CODE: ${{ inputs.xml_code }}
          RAW_NAME: ${{ inputs.file_name }}
        run: |
          # Automatically append .xml if user didn't type it
          if [[ "$RAW_NAME" != *.xml ]]; then
            FILE_NAME="${RAW_NAME}.xml"
          else
            FILE_NAME="$RAW_NAME"
          fi
          echo "Target File Name: $FILE_NAME"

          # Create workspace directories
          mkdir -p work_dir/res/drawable work_dir/output
          
          # Write raw XML safely
          echo "$XML_CODE" > "work_dir/res/drawable/$FILE_NAME"
          
          # Create minimal AndroidManifest.xml required for linking
          cat <<EOF > work_dir/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.sr7.compiler">
              <application />
          </manifest>
          EOF

          cd work_dir
          
          echo "Step 1: Compiling XML to flat file..."
          aapt2 compile --legacy -o compiled.zip res/drawable/$FILE_NAME
          
          echo "Step 2: Linking compiled file into binary AXML package..."
          aapt2 link --manifest AndroidManifest.xml -I ../android.jar -o output.apk compiled.zip
          
          echo "Step 3: Extracting final binary AXML..."
          unzip -o output.apk res/drawable/$FILE_NAME -d extracted/
          
          COMPILED_FILE="extracted/res/drawable/$FILE_NAME"
          
          if [ ! -f "$COMPILED_FILE" ]; then
            echo "Error: Compilation and linking failed!"
            exit 1
          fi
          
          # Move compiled binary AXML to repo destination folder (res/drawable)
          mkdir -p ../res/drawable
          cp "$COMPILED_FILE" ../res/drawable/$FILE_NAME
          echo "Successfully compiled and saved to res/drawable/$FILE_NAME"

          echo "FILE_NAME=$FILE_NAME" >> $GITHUB_ENV

      - name: Commit and Push Changes to Store Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "res/drawable/${{ env.FILE_NAME }}"
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to push."
          else
            git commit -m "Auto-compile AXML: ${{ env.FILE_NAME }} on store branch"
            git push origin store
          fi
