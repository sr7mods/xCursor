name: Compile Raw XML to Binary AXML

on:
  workflow_dispatch:
    inputs:
      xml_code:
        description: 'Raw XML Code (e.g., vector drawable)'
        required: true
        type: string
      file_path:
        description: 'Repository Folder Path (e.g., styles/minecraft/)'
        required: true
        default: 'res/drawable/'
        type: string
      file_name:
        description: 'Output File Name (e.g., minecraft_pointer.xml)'
        required: true
        default: 'output.xml'
        type: string

jobs:
      
  compile-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Store Branch
        uses: actions/checkout@v4
        with:
          ref: 'store'

      - name: Install aapt/aapt2
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt android-sdk-build-tools

      - name: Create and Compile XML
        env:
          XML_CODE: ${{ inputs.xml_code }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          # Create proper resource directory structure required by aapt2
          mkdir -p input_dir/drawable output_dir
          
          # Write raw XML safely using environment variable with exact filename
          echo "$XML_CODE" > "input_dir/drawable/$FILE_NAME"
          
          echo "Compiling XML using aapt2..."
          # Compile the file inside proper drawable resource folder
          aapt2 compile --legacy -o output_dir/compiled.zip "input_dir/drawable/$FILE_NAME"
          
          # Extract the compiled binary AXML from the zip
          unzip -o output_dir/compiled.zip -d output_dir/extracted/
          
          # Find the actual compiled file inside extracted folder
          COMPILED_FILE=$(find output_dir/extracted -name "*.xml" | head -n 1)
          
          if [ -z "$COMPILED_FILE" ]; then
            echo "Error: Compilation failed!"
            exit 1
          fi
          
          # Prepare final destination path
          TARGET_DIR="${{ inputs.file_path }}"
          mkdir -p "$TARGET_DIR"
          
          # Move compiled binary AXML to destination with desired file name
          cp "$COMPILED_FILE" "$TARGET_DIR/$FILE_NAME"
          echo "Successfully compiled and saved to $TARGET_DIR/$FILE_NAME"

      - name: Commit and Push Changes to Store Branch
        env:
          FILE_PATH: ${{ inputs.file_path }}
          FILE_NAME: ${{ inputs.file_name }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add "$FILE_PATH/$FILE_NAME"
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to push."
          else
            git commit -m "Auto-compile AXML: $FILE_NAME on store branch"
            git push origin store
          fi
